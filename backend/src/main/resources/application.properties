# =========================================================
# GlowGuide Backend - Base Configuration
# All secrets/URLs are externalized via environment variables.
# See .env.example at the repo root for the full list.
# =========================================================

spring.application.name=glowguide-backend
server.port=${SERVER_PORT:8080}

# Active profile (dev | prod) - override with SPRING_PROFILES_ACTIVE
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ---------------------------------------------------------
# MongoDB Atlas
# ---------------------------------------------------------
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/glowguide}

# ---------------------------------------------------------
# JWT
# ---------------------------------------------------------
app.jwt.secret=${JWT_SECRET:CHANGE_ME_dev_only_secret_key_min_256_bits_long_please_replace}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ---------------------------------------------------------
app.oauth2.enabled=${OAUTH2_ENABLED:false}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# ---------------------------------------------------------
# Mail (Spring Boot Mail / JavaMailSender)
# ---------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.mail.contact-to=${CONTACT_TO_EMAIL:${MAIL_USERNAME:}}

# ---------------------------------------------------------
# Cloudinary
# ---------------------------------------------------------
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ---------------------------------------------------------
# Frontend / CORS
# ---------------------------------------------------------
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# ---------------------------------------------------------
# AI Assistant (future integration - key never exposed to frontend)
# ---------------------------------------------------------
app.ai.provider=${AI_PROVIDER:none}
app.ai.api-key=${AI_API_KEY:}
app.ai.enabled=${AI_ASSISTANT_ENABLED:false}

# ---------------------------------------------------------
# Recommendation engine scoring weights (see RecommendationScoringProperties)
# ---------------------------------------------------------
app.recommendation.scoring.skin-type-match=${SCORE_SKIN_TYPE_MATCH:30}
app.recommendation.scoring.concern-match-per-item=${SCORE_CONCERN_MATCH:25}
app.recommendation.scoring.max-concern-matches=3
app.recommendation.scoring.ingredient-match-per-item=${SCORE_INGREDIENT_MATCH:20}
app.recommendation.scoring.max-ingredient-matches=3
app.recommendation.scoring.budget-match=${SCORE_BUDGET_MATCH:15}
app.recommendation.scoring.preference-match-per-item=${SCORE_PREFERENCE_MATCH:10}
app.recommendation.scoring.category-preference-match=${SCORE_CATEGORY_PREFERENCE_MATCH:10}
app.recommendation.scoring.routine-preference-match=${SCORE_ROUTINE_PREFERENCE_MATCH:10}
app.recommendation.scoring.max-preference-matches=2
app.recommendation.scoring.sensitivity-penalty-per-caution=15
app.recommendation.scoring.avoided-ingredient-penalty=100
app.recommendation.scoring.minimum-score-threshold=10
app.recommendation.scoring.max-results=12

# ---------------------------------------------------------
# Jackson
# ---------------------------------------------------------
spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.fail-on-unknown-properties=false

# ---------------------------------------------------------
# Multipart (image uploads)
# ---------------------------------------------------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---------------------------------------------------------
# Logging
# ---------------------------------------------------------
logging.level.com.glowguide=${LOG_LEVEL:INFO}

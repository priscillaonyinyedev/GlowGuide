# =========================================================
# GlowGuide Backend - Development Profile
# =========================================================

# Seed the database with demo brands/products/ingredients on startup
app.seed.enabled=${SEED_ENABLED:true}

# Verbose logging while developing
logging.level.org.springframework.security=DEBUG
logging.level.com.glowguide=DEBUG

# Show detailed error responses in dev
server.error.include-message=always
server.error.include-binding-errors=always
